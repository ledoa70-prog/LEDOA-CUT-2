name: LEDOA Payment Calculator APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'payment/**'
      - '.github/workflows/ledoa-indopayment-apk.yml'
jobs:
  build-payment-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android debug APK
        run: gradle -p payment :app:assembleDebug --stacktrace
      - name: Validate APK file
        run: |
          test -s payment/app/build/outputs/apk/debug/app-debug.apk
          unzip -t payment/app/build/outputs/apk/debug/app-debug.apk | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: LEDOA_IndoPayment_Android_v1.0.0
          path: payment/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
