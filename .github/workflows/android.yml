name: Android APK
on: [workflow_dispatch, push]
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - uses: gradle/actions/setup-gradle@v4
     with: {gradle-version: '8.10.2'}
   - run: gradle :app:assembleDebug --stacktrace
   - run: grep -q 'VERSION_NAME=0.1.0' app/version.properties && test -f app/build/outputs/apk/debug/app-debug.apk
   - uses: actions/upload-artifact@v4
     with: {name: LEDOA_CUT_2_v0.1.0, path: app/build/outputs/apk/debug/app-debug.apk}